name: CI/CD Pipeline

on:
  push:
    branches: [ dev, docker_cicd ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:   # allows manual trigger

jobs:
  # Job 1: Train & Test the model
  check_working_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Test model accuracy
        run: python test.py

      - name: Upload trained model as artifact (for later use)
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: savedmodel.pth

  # Job 2: Build & push Docker image (only on docker_cicd branch)
  build_and_push:
    runs-on: ubuntu-latest
    needs: check_working_repo   # wait for training to succeed
    if: github.ref == 'refs/heads/docker_cicd'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/olivetti-mlops:latest
            ${{ secrets.DOCKER_USERNAME }}/olivetti-mlops:${{ github.sha }}